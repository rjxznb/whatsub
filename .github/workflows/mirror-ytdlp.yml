# Mirror the latest official yt-dlp binaries to the mainland DogeCloud CDN.
# The version manifest is uploaded last so clients never observe a version
# before both platform binaries are available.
name: Mirror yt-dlp to DogeCloud

on:
  workflow_dispatch:
    inputs:
      notes:
        description: 'Optional notes shown in the in-app update prompt (e.g. 修复 YouTube 下载)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: dogecloud-ytdlp-mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download latest official yt-dlp binaries
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          mkdir -p dist
          release=$(gh api repos/yt-dlp/yt-dlp/releases/latest)
          version=$(jq -r '.tag_name' <<<"$release")
          body=$(jq -r '.body // ""' <<<"$release")
          notes=${NOTES:-$body}
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 3 --retry-all-errors \
            -o dist/yt-dlp.exe \
            "https://github.com/yt-dlp/yt-dlp/releases/download/$version/yt-dlp.exe"
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 3 --retry-all-errors \
            -o dist/yt-dlp_macos \
            "https://github.com/yt-dlp/yt-dlp/releases/download/$version/yt-dlp_macos"
          jq -n --arg version "$version" --arg notes "$notes" \
            '{version:$version, notes:$notes}' > dist/yt-dlp-version.json
          test $(stat -c%s dist/yt-dlp.exe) -gt 1000000
          test $(stat -c%s dist/yt-dlp_macos) -gt 1000000
          cat dist/yt-dlp-version.json

      - name: Install DogeCloud upload dependency
        run: python -m pip install --disable-pip-version-check boto3

      - name: Upload binaries, then promote version manifest
        env:
          DOGECLOUD_ACCESS_KEY: ${{ secrets.DOGECLOUD_ACCESS_KEY }}
          DOGECLOUD_SECRET_KEY: ${{ secrets.DOGECLOUD_SECRET_KEY }}
          DOGECLOUD_BUCKET: ${{ secrets.DOGECLOUD_BUCKET }}
          DOGECLOUD_DOWNLOAD_DOMAIN: ${{ secrets.DOGECLOUD_DOWNLOAD_DOMAIN }}
        run: |
          set -euo pipefail
          version=$(jq -r '.version' dist/yt-dlp-version.json)
          python scripts/dogecloud_upload.py dist/yt-dlp.exe "yt-dlp/$version/yt-dlp.exe" \
            --content-type application/vnd.microsoft.portable-executable
          python scripts/dogecloud_upload.py dist/yt-dlp_macos "yt-dlp/$version/yt-dlp_macos" \
            --content-type application/octet-stream

      - name: Verify versioned binaries, then promote manifest
        env:
          DOMAIN: ${{ secrets.DOGECLOUD_DOWNLOAD_DOMAIN }}
          DOGECLOUD_ACCESS_KEY: ${{ secrets.DOGECLOUD_ACCESS_KEY }}
          DOGECLOUD_SECRET_KEY: ${{ secrets.DOGECLOUD_SECRET_KEY }}
          DOGECLOUD_BUCKET: ${{ secrets.DOGECLOUD_BUCKET }}
          DOGECLOUD_DOWNLOAD_DOMAIN: ${{ secrets.DOGECLOUD_DOWNLOAD_DOMAIN }}
        run: |
          set -euo pipefail
          domain=${DOMAIN%/}
          version=$(jq -r '.version' dist/yt-dlp-version.json)
          for file in yt-dlp.exe yt-dlp_macos; do
            path="yt-dlp/$version/$file"
            expected_size=$(stat -c%s "dist/$file")
            verified=false
            for attempt in 1 2 3 4 5 6; do
              headers=$(mktemp)
              status=$(curl --proto '=https' --proto-redir '=https' \
                --silent --show-error --location --range 0-0 \
                --dump-header "$headers" --output /dev/null --write-out '%{http_code}' \
                "$domain/$path") || true
              content_range=$(awk 'tolower($0) ~ /^content-range:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' "$headers")
              rm -f "$headers"
              if [ "$status" = 206 ] && [ "$content_range" = "bytes 0-0/$expected_size" ]; then
                verified=true
                break
              fi
              sleep 5
            done
            [ "$verified" = true ] || { echo "::error::CDN verification failed for $path"; exit 1; }
          done
          python scripts/dogecloud_upload.py dist/yt-dlp-version.json yt-dlp/yt-dlp-version.json \
            --cache-control 'no-cache, max-age=60' --content-type application/json

      - name: Verify public version manifest
        env:
          DOMAIN: ${{ secrets.DOGECLOUD_DOWNLOAD_DOMAIN }}
        run: |
          set -euo pipefail
          expected=$(jq -r '.version' dist/yt-dlp-version.json)
          actual=$(curl --proto '=https' --proto-redir '=https' --fail --location \
            "${DOMAIN%/}/yt-dlp/yt-dlp-version.json?ci=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
            | jq -r '.version')
          [ "$actual" = "$expected" ]
