# Build the macOS Apple Silicon .dmg installer for a release.
#
# Manually triggered: produces .dmg + .app artifacts that you download and
# upload to the public Get_Video-releases repo as a Release asset.
#
# v1 does NOT publish updater artifacts for Mac — first-time install only.
# (Auto-update for Mac would need TAURI_SIGNING_PRIVATE_KEY in CI secrets +
#  an entry in latest.json. tauri.macos.conf.json sets createUpdaterArtifacts
#  to false to skip that whole codepath.)

name: Release macOS

on:
  workflow_dispatch:
    inputs:
      whisper_tag:
        description: 'whisper.cpp tag'
        required: true
        default: 'v1.8.4'
      ffmpeg_url:
        description: 'Static ffmpeg arm64 zip URL'
        required: true
        default: 'https://www.osxexperts.net/ffmpeg711arm.zip'

jobs:
  build:
    runs-on: macos-14    # Apple Silicon
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ─── Repopulate binaries/ on the runner (gitignored on disk) ─────
      - name: Build whisper.cpp (Metal)
        run: |
          git clone --depth 1 --branch ${{ inputs.whisper_tag }} https://github.com/ggerganov/whisper.cpp.git whisper-src
          cd whisper-src
          cmake -S . -B build \
            -DGGML_METAL=ON -DBUILD_SHARED_LIBS=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j$(sysctl -n hw.ncpu)

      - name: Stage whisper artifacts into binaries/
        run: |
          set -e
          BIN=client/src-tauri/binaries
          mkdir -p $BIN
          WHISPER_CLI=$(find whisper-src/build -name whisper-cli ! -name "*.dSYM*" | head -1)
          cp -L "$WHISPER_CLI" "$BIN/whisper-cli-aarch64-apple-darwin"

          # whisper.cpp produces libwhisper.X.dylib as a symlink to the real
          # libwhisper.X.Y.Z.dylib. We must dereference (-L) when copying so
          # the destination is a real file (Tauri rejects dangling symlinks).
          # Drop -type f from find so the symlink itself is matched.
          for name in libwhisper.1 libggml.0 libggml-base.0 libggml-blas.0 libggml-cpu.0 libggml-metal.0; do
            f=$(find whisper-src/build -name "${name}.dylib" | head -1)
            if [ -z "$f" ]; then
              echo "::error::Missing dylib match for ${name}.dylib"
              find whisper-src/build -name "lib*.dylib"
              exit 1
            fi
            cp -L "$f" "$BIN/${name}.dylib"
          done

          echo "=== staged $BIN/ ==="
          ls -la $BIN/
          echo "=== sanity: whisper-cli rpath deps ==="
          otool -L "$BIN/whisper-cli-aarch64-apple-darwin"

      - name: Fix dylib install_names + ad-hoc codesign
        run: |
          cd client/src-tauri/binaries
          for f in *.dylib; do
            install_name_tool -id "@loader_path/$f" "$f" || true
            for ref in $(otool -L "$f" | awk 'NR>1 {print $1}'); do
              base=$(basename "$ref")
              if [ -f "$base" ] && [ "$ref" != "@loader_path/$base" ]; then
                install_name_tool -change "$ref" "@loader_path/$base" "$f" || true
              fi
            done
          done
          for ref in $(otool -L whisper-cli-aarch64-apple-darwin | awk 'NR>1 {print $1}'); do
            base=$(basename "$ref")
            if [ -f "$base" ]; then
              install_name_tool -change "$ref" "@loader_path/$base" whisper-cli-aarch64-apple-darwin || true
            fi
          done
          for f in *; do
            [ -f "$f" ] && codesign --force --sign - "$f" || true
          done

      - name: Download static ffmpeg (arm64)
        run: |
          curl -L -o ffmpeg.zip "${{ inputs.ffmpeg_url }}"
          unzip -o ffmpeg.zip -d ffmpeg-extract
          BIN=$(find ffmpeg-extract -name ffmpeg -type f | head -1)
          cp "$BIN" client/src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          chmod +x client/src-tauri/binaries/ffmpeg-aarch64-apple-darwin

      - name: Download yt-dlp
        run: |
          curl -L -o client/src-tauri/binaries/yt-dlp-aarch64-apple-darwin \
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos"
          chmod +x client/src-tauri/binaries/yt-dlp-aarch64-apple-darwin

      # ─── Build the Tauri app ───────────────────────────────────────────
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install JS dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Tauri build (.dmg + .app + updater .app.tar.gz)
        working-directory: client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # createUpdaterArtifacts: true in tauri.conf.json — Tauri auto-adds the
        # app.tar.gz updater bundle to the output set. No --bundles flag → all
        # configured targets are produced.
        run: pnpm tauri build

      - name: Show bundle output
        run: |
          ls -la client/src-tauri/target/release/bundle/dmg/ || true
          ls -la client/src-tauri/target/release/bundle/macos/ || true

      # ─── Ad-hoc codesign the .app inside the .dmg ─────────────────────
      # Without this, dyld refuses to load the bundled dylibs even after
      # the user clicks past Gatekeeper. install_name_tool already fixed
      # rpaths; this just makes the loader accept the unsigned bundle.
      - name: Ad-hoc codesign .app
        run: |
          APP=$(find client/src-tauri/target/release/bundle/macos -name "*.app" -maxdepth 2 -type d | head -1)
          if [ -n "$APP" ]; then
            codesign --force --deep --sign - "$APP" || true
            codesign -dv "$APP" 2>&1 | head -5
          fi

      - name: Upload artifacts (workflow run, for inspection)
        uses: actions/upload-artifact@v4
        with:
          name: macos-installer
          path: |
            client/src-tauri/target/release/bundle/dmg/*.dmg
            client/src-tauri/target/release/bundle/macos/*.app
            client/src-tauri/target/release/bundle/macos/*.app.tar.gz
            client/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 30
          if-no-files-found: error

      # ─── Publish to public release repo ────────────────────────────────
      # Uses a fine-grained PAT (RELEASES_REPO_TOKEN) scoped only to
      # rjxznb/Get_Video-releases. Uploads the Mac bundles and merges the
      # darwin-aarch64 entry into latest.json — only if the release already
      # has a latest.json for this version (i.e. Windows side has been done).
      # Mac is the "follower": it adds itself to the existing manifest.
      - name: Publish to releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: |
          set -e
          VERSION=$(jq -r .version client/src-tauri/tauri.conf.json)
          TAG="v$VERSION"
          REPO=rjxznb/Get_Video-releases
          BUNDLE=client/src-tauri/target/release/bundle
          DMG="$BUNDLE/dmg/Eversay Studio_${VERSION}_aarch64.dmg"
          TARGZ="$BUNDLE/macos/Eversay Studio.app.tar.gz"
          SIGFILE="$BUNDLE/macos/Eversay Studio.app.tar.gz.sig"

          # Sanity
          for f in "$DMG" "$TARGZ" "$SIGFILE"; do
            [ -f "$f" ] || { echo "::error::missing $f"; exit 1; }
          done

          # Ensure release exists; create draft if not.
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "::notice::release $TAG not found — creating"
            gh release create "$TAG" --repo "$REPO" \
              --title "Eversay Studio $TAG" \
              --notes "Automated release from macOS CI"
          fi

          gh release upload "$TAG" "$DMG" "$TARGZ" "$SIGFILE" \
            --repo "$REPO" --clobber

          # Update latest.json — preserve other platforms (e.g. windows-x86_64).
          # If no latest.json yet on this release, skip (Windows side will create
          # it first; Mac follower can re-run after).
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          URL="https://github.com/$REPO/releases/download/$TAG/Eversay.Studio.app.tar.gz"
          # Tauri's signature value is base64 of the entire .sig file content.
          SIG=$(base64 < "$SIGFILE" | tr -d '\n')

          if gh release download "$TAG" --repo "$REPO" --pattern latest.json -O existing.json 2>/dev/null; then
            jq --arg sig "$SIG" --arg now "$NOW" --arg url "$URL" \
              '.pub_date = $now | .platforms["darwin-aarch64"] = {signature: $sig, url: $url}' \
              existing.json > latest.json
            gh release upload "$TAG" latest.json --repo "$REPO" --clobber
            echo "::notice::Updated latest.json with darwin-aarch64 entry"
          else
            echo "::warning::No latest.json in $TAG yet — skipping. Run Windows release first, then re-trigger this workflow."
          fi
