# Unified release workflow.
#
# Builds Windows (.msi + .sig) and macOS (.dmg + .app.tar.gz + .sig) in
# parallel, then publishes both to rjxznb/whatsub-releases as a single
# GitHub Release with one assembled latest.json.
#
# Triggered manually from Actions UI. Use dry_run=true to produce
# artifacts without publishing — useful for installing/testing the .msi
# or .dmg before committing it to the public release repo. After verifying,
# re-trigger with dry_run=false (or fetch artifacts and run the publish
# job logic locally).

name: Release

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Which platforms to build & publish'
        type: choice
        options:
          - both
          - windows
          - macos
        default: both
      release_notes:
        description: 'User-facing release notes (shown in the in-app update toast)'
        required: true
        default: 'Bug fixes and improvements'
      whisper_tag:
        description: 'whisper.cpp git tag to build from source (Win + Mac)'
        required: true
        default: 'v1.8.4'
      vulkan_sdk_version:
        description: 'LunarG Vulkan SDK version (Windows whisper-cli build). Note: LunarG removes older versions; check https://vulkan.lunarg.com/sdk/home if download fails.'
        required: true
        default: '1.4.309.0'
      ffmpeg_url_macos:
        description: 'Static ffmpeg arm64 zip URL'
        required: true
        default: 'https://www.osxexperts.net/ffmpeg711arm.zip'
      ffprobe_url_macos:
        description: 'Static ffprobe arm64 zip URL (osxexperts publishes ffmpeg/ffprobe separately on macOS — Win gyan.dev bundles both in one zip)'
        required: true
        default: 'https://www.osxexperts.net/ffprobe711arm.zip'
      ffmpeg_url_windows:
        description: 'Static ffmpeg Windows zip URL (must contain bin/ffmpeg.exe). gyan.dev is more stable than BtbN whose latest-tag asset names rotate.'
        required: true
        default: 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip'
      node_version:
        description: 'Node.js version bundled as sidecar (used by yt-dlp for YouTube n-challenge). Pick an LTS minor — see https://nodejs.org/en/about/previous-releases'
        required: true
        default: '22.11.0'
      dry_run:
        description: 'Build artifacts only — do not publish to release repo'
        type: boolean
        default: false

jobs:
  # ─────────────────────────────────────────────────────────────────
  build-windows:
    if: inputs.targets == 'both' || inputs.targets == 'windows'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Caches ──────────────────────────────────────────────────────
      # Whisper outputs are reproducible from (whisper_tag, vulkan_sdk_version);
      # cache the staged sidecar + DLLs so subsequent runs skip ~5-8 min of
      # cmake build + linker work entirely.
      - name: Cache Whisper Windows binaries
        id: whisper-cache-win
        uses: actions/cache@v4
        with:
          path: |
            client/src-tauri/binaries/whisper-cli-x86_64-pc-windows-msvc.exe
            client/src-tauri/binaries/whisper.dll
            client/src-tauri/binaries/ggml.dll
            client/src-tauri/binaries/ggml-base.dll
            client/src-tauri/binaries/ggml-cpu.dll
            client/src-tauri/binaries/ggml-vulkan.dll
          key: whisper-windows-${{ inputs.whisper_tag }}-vk${{ inputs.vulkan_sdk_version }}-cpu-avx-only-v1

      # Vulkan SDK is only consumed by the whisper.cpp compile, so when the
      # whisper cache hits we don't need it at all. Otherwise the cache below
      # restores a ~500 MB install and skips the LunarG download.
      - name: Cache Vulkan SDK
        id: vulkan-cache
        if: steps.whisper-cache-win.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK\${{ inputs.vulkan_sdk_version }}
          key: vulkan-sdk-${{ inputs.vulkan_sdk_version }}

      - name: Install Vulkan SDK
        if: steps.whisper-cache-win.outputs.cache-hit != 'true' && steps.vulkan-cache.outputs.cache-hit != 'true'
        run: |
          $version = "${{ inputs.vulkan_sdk_version }}"
          $url = "https://sdk.lunarg.com/sdk/download/$version/windows/VulkanSDK-$version-Installer.exe"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile VulkanSDK.exe -UseBasicParsing
          Write-Host "Installing VulkanSDK $version (silent)..."
          $proc = Start-Process -FilePath .\VulkanSDK.exe `
            -ArgumentList '--accept-licenses','--default-answer','--confirm-command','install' `
            -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            Write-Error "Vulkan SDK installer failed with exit code $($proc.ExitCode)"
            exit 1
          }
          $sdk = "C:\VulkanSDK\$version"
          if (-not (Test-Path "$sdk\Include\vulkan\vulkan.h")) {
            Write-Error "Vulkan SDK install incomplete: $sdk"
            exit 1
          }

      - name: Set Vulkan env (always when whisper miss)
        if: steps.whisper-cache-win.outputs.cache-hit != 'true'
        run: |
          $sdk = "C:\VulkanSDK\${{ inputs.vulkan_sdk_version }}"
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build whisper.cpp (Vulkan)
        if: steps.whisper-cache-win.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "${{ inputs.whisper_tag }}" `
            https://github.com/ggerganov/whisper.cpp.git whisper-src
          cd whisper-src
          # GGML_NATIVE=OFF + AVX2/AVX512/FMA disabled → conservative CPU
          # baseline (AVX only, ~2012+ x64 CPUs). Without this, the CI host's
          # AVX-512 Xeon bakes incompatible SIMD into ggml-cpu.dll and the
          # binary crashes with STATUS_ILLEGAL_INSTRUCTION (-1073741795)
          # on user CPUs without those extensions — even when the active
          # backend is Vulkan, mel-spectrogram preprocessing still runs
          # on CPU SIMD code paths.
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DGGML_VULKAN=ON `
            -DGGML_NATIVE=OFF `
            -DGGML_AVX=ON `
            -DGGML_AVX2=OFF `
            -DGGML_AVX512=OFF `
            -DGGML_FMA=OFF `
            -DGGML_F16C=ON `
            -DBUILD_SHARED_LIBS=ON `
            -DWHISPER_BUILD_TESTS=OFF `
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS

      - name: Stage Windows binaries/
        if: steps.whisper-cache-win.outputs.cache-hit != 'true'
        run: |
          $bin = "client/src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null

          # whisper-cli sidecar — Tauri externalBin requires the host triple suffix
          $cli = Get-ChildItem -Path "whisper-src/build" -Recurse -Filter "whisper-cli.exe" `
            | Select-Object -First 1
          if (-not $cli) { Write-Error "whisper-cli.exe not found"; exit 1 }
          Copy-Item $cli.FullName "$bin/whisper-cli-x86_64-pc-windows-msvc.exe"

          # Companion DLLs — bare names, referenced by tauri.windows.conf.json
          # bundle.resources and copied next to the exe by build.rs at compile time.
          $dlls = @('whisper.dll','ggml.dll','ggml-base.dll','ggml-cpu.dll','ggml-vulkan.dll')
          foreach ($d in $dlls) {
            # Prefer Release/ build output if present (multi-config generator)
            $f = Get-ChildItem -Path "whisper-src/build" -Recurse -Filter $d `
              | Where-Object { $_.FullName -match 'Release' } `
              | Select-Object -First 1
            if (-not $f) {
              $f = Get-ChildItem -Path "whisper-src/build" -Recurse -Filter $d | Select-Object -First 1
            }
            if (-not $f) { Write-Error "missing $d in whisper-src/build"; exit 1 }
            Copy-Item $f.FullName "$bin/$d"
          }

          Write-Host "=== staged $bin/ ==="
          Get-ChildItem $bin

      - name: Download yt-dlp
        run: |
          Invoke-WebRequest `
            -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" `
            -OutFile "client/src-tauri/binaries/yt-dlp-x86_64-pc-windows-msvc.exe" `
            -UseBasicParsing

      - name: Download static ffmpeg + ffprobe
        run: |
          $url = "${{ inputs.ffmpeg_url_windows }}"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -UseBasicParsing
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extract -Force
          # gyan.dev's "essentials" zip ships ffmpeg.exe AND ffprobe.exe in bin/.
          # ffprobe is needed by yt-dlp for fragmented DASH/HLS streams (rare
          # but cause confusing "ffprobe not found" failures when missing).
          $ffmpeg = Get-ChildItem -Path ffmpeg-extract -Recurse -Filter "ffmpeg.exe" `
            | Select-Object -First 1
          if (-not $ffmpeg) { Write-Error "ffmpeg.exe not found in archive"; exit 1 }
          Copy-Item $ffmpeg.FullName "client/src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe"

          $ffprobe = Get-ChildItem -Path ffmpeg-extract -Recurse -Filter "ffprobe.exe" `
            | Select-Object -First 1
          if (-not $ffprobe) { Write-Error "ffprobe.exe not found in archive"; exit 1 }
          Copy-Item $ffprobe.FullName "client/src-tauri/binaries/ffprobe-x86_64-pc-windows-msvc.exe"

      # Bundled node.exe for yt-dlp's YouTube n-challenge JS solver.
      # Without this, downloads fail with "Requested format is not available".
      - name: Cache Node sidecar (Windows)
        id: node-cache-win
        uses: actions/cache@v4
        with:
          path: client/src-tauri/binaries/node-x86_64-pc-windows-msvc.exe
          key: node-windows-${{ inputs.node_version }}

      - name: Download Node sidecar (Windows)
        if: steps.node-cache-win.outputs.cache-hit != 'true'
        run: |
          $v = "${{ inputs.node_version }}"
          $url = "https://nodejs.org/dist/v$v/node-v$v-win-x64.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile node.zip -UseBasicParsing
          Expand-Archive -Path node.zip -DestinationPath node-extract -Force
          $node = Get-ChildItem -Path node-extract -Recurse -Filter "node.exe" `
            | Select-Object -First 1
          if (-not $node) { Write-Error "node.exe not found in archive"; exit 1 }
          Copy-Item $node.FullName "client/src-tauri/binaries/node-x86_64-pc-windows-msvc.exe"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install JS dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Cache Cargo (Windows)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
          shared-key: tauri-build-windows

      - name: Tauri build (.msi + .sig)
        working-directory: client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # --bundles msi: skip the nsis target (base tauri.conf.json has
        # bundle.targets="all", which on Windows would also produce nsis).
        # createUpdaterArtifacts:true ensures the .msi.sig is emitted.
        run: pnpm tauri build --bundles msi

      - name: Show bundle output
        run: Get-ChildItem -Recurse client/src-tauri/target/release/bundle/msi

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: |
            client/src-tauri/target/release/bundle/msi/*.msi
            client/src-tauri/target/release/bundle/msi/*.msi.sig
          retention-days: 7
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────
  build-macos:
    if: inputs.targets == 'both' || inputs.targets == 'macos'
    runs-on: macos-14   # Apple Silicon
    # Build (~5 min) + decoupled notarization poll (50 min cap) + staple +
    # .app.tar.gz repackage (~1 min) ≈ 56 min worst case. 70 leaves slack.
    timeout-minutes: 70
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Reproducible from whisper_tag alone (no Vulkan SDK on Mac). On a hit
      # we skip the full clone+cmake+install_name_tool+codesign chain (~3 min).
      - name: Cache Whisper macOS binaries
        id: whisper-cache-mac
        uses: actions/cache@v4
        with:
          path: |
            client/src-tauri/binaries/whisper-cli-aarch64-apple-darwin
            client/src-tauri/binaries/libwhisper.1.dylib
            client/src-tauri/binaries/libggml.0.dylib
            client/src-tauri/binaries/libggml-base.0.dylib
            client/src-tauri/binaries/libggml-blas.0.dylib
            client/src-tauri/binaries/libggml-cpu.0.dylib
            client/src-tauri/binaries/libggml-metal.0.dylib
          # Cache key includes an install_name version tag — bump when changing
          # the install_name_tool / RPATH layout so old cached binaries with
          # incompatible loader paths don't get reused.
          key: whisper-macos-${{ inputs.whisper_tag }}-rpath2

      - name: Build whisper.cpp (Metal)
        if: steps.whisper-cache-mac.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch ${{ inputs.whisper_tag }} \
            https://github.com/ggerganov/whisper.cpp.git whisper-src
          cd whisper-src
          cmake -S . -B build \
            -DGGML_METAL=ON -DBUILD_SHARED_LIBS=ON \
            -DWHISPER_BUILD_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release -j$(sysctl -n hw.ncpu)

      - name: Stage whisper artifacts into binaries/
        if: steps.whisper-cache-mac.outputs.cache-hit != 'true'
        run: |
          set -e
          BIN=client/src-tauri/binaries
          mkdir -p $BIN
          WHISPER_CLI=$(find whisper-src/build -name whisper-cli ! -name "*.dSYM*" | head -1)
          cp -L "$WHISPER_CLI" "$BIN/whisper-cli-aarch64-apple-darwin"

          # whisper.cpp emits libwhisper.X.dylib as a symlink to the real
          # libwhisper.X.Y.Z.dylib. Dereference (-L) so destination is a real
          # file (Tauri rejects dangling symlinks in bundle resources).
          for name in libwhisper.1 libggml.0 libggml-base.0 libggml-blas.0 libggml-cpu.0 libggml-metal.0; do
            f=$(find whisper-src/build -name "${name}.dylib" | head -1)
            if [ -z "$f" ]; then
              echo "::error::Missing dylib match for ${name}.dylib"
              find whisper-src/build -name "lib*.dylib"
              exit 1
            fi
            cp -L "$f" "$BIN/${name}.dylib"
          done

          echo "=== staged $BIN/ ==="
          ls -la $BIN/

      - name: Fix dylib install_names + ad-hoc codesign
        if: steps.whisper-cache-mac.outputs.cache-hit != 'true'
        run: |
          cd client/src-tauri/binaries

          # Each dylib's own id + inter-dylib refs → @loader_path/<name>.
          # The 6 dylibs are always co-located (target/debug/ in dev,
          # Contents/Frameworks/ in the bundled .app), so @loader_path works.
          for f in *.dylib; do
            install_name_tool -id "@loader_path/$f" "$f" || true
            for ref in $(otool -L "$f" | awk 'NR>1 {print $1}'); do
              base=$(basename "$ref")
              if [ -f "$base" ] && [ "$ref" != "@loader_path/$base" ]; then
                install_name_tool -change "$ref" "@loader_path/$base" "$f" || true
              fi
            done
          done

          # whisper-cli is NOT co-located with the dylibs in production:
          #   dev:  target/debug/whisper-cli   → dylibs in target/debug/
          #   prod: Contents/MacOS/whisper-cli → dylibs in Contents/Frameworks/
          # (the Frameworks/ path is where Tauri's bundle.macOS.frameworks
          #  copies them — see tauri.macos.conf.json.)
          # Rewrite refs to @rpath/<name> and add two LC_RPATH entries
          # covering both layouts; dyld tries each rpath in order.
          for ref in $(otool -L whisper-cli-aarch64-apple-darwin | awk 'NR>1 {print $1}'); do
            base=$(basename "$ref")
            if [ -f "$base" ]; then
              install_name_tool -change "$ref" "@rpath/$base" whisper-cli-aarch64-apple-darwin || true
            fi
          done
          install_name_tool -add_rpath "@executable_path/" whisper-cli-aarch64-apple-darwin || true
          install_name_tool -add_rpath "@executable_path/../Frameworks/" whisper-cli-aarch64-apple-darwin || true

          # install_name_tool invalidates code signatures — re-sign everything.
          for f in *; do
            [ -f "$f" ] && codesign --force --sign - "$f" || true
          done

      - name: Download static ffmpeg (arm64)
        run: |
          curl -L --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 30 -o ffmpeg.zip "${{ inputs.ffmpeg_url_macos }}"
          unzip -o ffmpeg.zip -d ffmpeg-extract
          BIN=$(find ffmpeg-extract -name ffmpeg -type f | head -1)
          cp "$BIN" client/src-tauri/binaries/ffmpeg-aarch64-apple-darwin
          chmod +x client/src-tauri/binaries/ffmpeg-aarch64-apple-darwin

      - name: Download static ffprobe (arm64)
        run: |
          # osxexperts ships ffprobe in a separate zip on macOS; needed by
          # yt-dlp for fragmented DASH/HLS streams.
          curl -L --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 30 -o ffprobe.zip "${{ inputs.ffprobe_url_macos }}"
          unzip -o ffprobe.zip -d ffprobe-extract
          BIN=$(find ffprobe-extract -name ffprobe -type f | head -1)
          cp "$BIN" client/src-tauri/binaries/ffprobe-aarch64-apple-darwin
          chmod +x client/src-tauri/binaries/ffprobe-aarch64-apple-darwin

      - name: Download yt-dlp
        run: |
          curl -L --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 30 -o client/src-tauri/binaries/yt-dlp-aarch64-apple-darwin \
            "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos"
          chmod +x client/src-tauri/binaries/yt-dlp-aarch64-apple-darwin

      # Bundled node for yt-dlp's YouTube n-challenge JS solver — same reason
      # as Windows. Mac users without Homebrew/node had no fallback before.
      - name: Cache Node sidecar (macOS arm64)
        id: node-cache-mac
        uses: actions/cache@v4
        with:
          path: client/src-tauri/binaries/node-aarch64-apple-darwin
          key: node-macos-arm64-${{ inputs.node_version }}

      - name: Download Node sidecar (macOS arm64)
        if: steps.node-cache-mac.outputs.cache-hit != 'true'
        run: |
          v="${{ inputs.node_version }}"
          curl -L --retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 30 -o node.tar.gz "https://nodejs.org/dist/v$v/node-v$v-darwin-arm64.tar.gz"
          tar -xzf node.tar.gz
          BIN=$(find . -path "*/bin/node" -type f | head -1)
          if [ -z "$BIN" ]; then
            echo "::error::node binary not found in archive"
            find . -name node -type f
            exit 1
          fi
          cp "$BIN" client/src-tauri/binaries/node-aarch64-apple-darwin
          chmod +x client/src-tauri/binaries/node-aarch64-apple-darwin

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install JS dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Cache Cargo (macOS)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
          shared-key: tauri-build-macos

      # Single-step build retried up to 3x. The previous split-into-two-phases
      # design backfired: Tauri's `--bundles dmg` cleans up the .app folder
      # after producing the .dmg (since "dmg" target alone doesn't preserve
      # the loose .app), which broke the downstream "Locate macOS bundle
      # artifacts" step that needs both.
      #
      # Single-call `pnpm tauri build` produces everything in one pass and
      # leaves all artifacts (.app, .app.tar.gz, .sig, .dmg) on disk. Retry
      # absorbs `bundle_dmg.sh` flakiness — its create-dmg wrapper relies
      # on AppleScript + hdiutil + diskimages-helper, all of which sometimes
      # fail on macos-14 runners with a generic 4-second "failed to bundle
      # project" error. Same workflow file produces a green dmg one run and
      # red the next; pure flake.
      #
      # Re-running the whole tauri build is cheap on retry: cargo is cached,
      # vite is cached, only the bundle step does meaningful new work.
      # Hard-fails after 3 attempts because downstream Apple notarization +
      # stapler steps consume the .dmg directly.
      - name: Tauri build (signed; 3x retry for bundle_dmg.sh flakes)
        working-directory: client
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID deliberately omitted —
          # Tauri's built-in notarytool wait gives no progress visibility.
          # We notarize ourselves in a separate step below with explicit
          # status polling + recoverable submission ID.
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "::group::tauri build attempt $attempt/3"
            pnpm tauri build
            rc=$?
            echo "::endgroup::"
            if [ $rc -eq 0 ]; then
              echo "✓ tauri build succeeded on attempt $attempt"
              exit 0
            fi
            echo "::warning::tauri build attempt $attempt failed (rc=$rc); cleaning up before retry"
            # bundle_dmg leaves orphaned mounted volumes + diskimages-helper
            # processes that block the next attempt. Detach + kill before retry.
            hdiutil info | awk '/\/Volumes\/whatsub/ {print $1}' | while read -r dev; do
              echo "detaching $dev"
              hdiutil detach -force "$dev" 2>/dev/null || true
            done
            pkill -9 diskimages-helper 2>/dev/null || true
            sleep 8
          done
          echo "::error::tauri build failed all 3 attempts — re-run the workflow"
          exit 1

      - name: Locate macOS bundle artifacts
        id: locate
        run: |
          set -e
          APP=$(find client/src-tauri/target/release/bundle/macos -maxdepth 2 -name "*.app" -type d | head -1)
          DMG=$(find client/src-tauri/target/release/bundle/dmg -maxdepth 2 -name "*.dmg" -type f | head -1)
          APP_TARGZ=$(find client/src-tauri/target/release/bundle/macos -maxdepth 2 -name "*.app.tar.gz" -type f | head -1)
          [ -d "$APP" ] || { echo "::error::.app missing"; exit 1; }
          [ -f "$DMG" ] || { echo "::error::.dmg missing"; exit 1; }
          [ -f "$APP_TARGZ" ] || { echo "::error::.app.tar.gz missing"; exit 1; }
          {
            echo "app=$APP"
            echo "dmg=$DMG"
            echo "app_targz=$APP_TARGZ"
          } >> "$GITHUB_OUTPUT"
          echo "--- artifacts ---"
          ls -la "$DMG" "$APP_TARGZ"

      - name: Submit .dmg to Apple notary
        id: submit
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DMG: ${{ steps.locate.outputs.dmg }}
        run: |
          set -e
          echo "=== submitting $DMG ==="
          SUBMIT=$(xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --output-format json)
          echo "$SUBMIT" | jq .
          SID=$(echo "$SUBMIT" | jq -r .id)
          if [ -z "$SID" ] || [ "$SID" = "null" ]; then
            echo "::error::notarytool submit failed"
            exit 1
          fi
          echo "::notice::Apple notary submission id=$SID"
          # Persist SID for the safety-net artifact (consumed by finalize-mac.yml).
          echo "$SID" > submission_id.txt
          echo "sid=$SID" >> "$GITHUB_OUTPUT"

      # Always upload signed-but-unstapled artifacts after a successful submit.
      # If the next poll step times out (Apple's first-account queue can take
      # hours), the user can recover via finalize-mac.yml without rebuilding.
      - name: Upload signed-only macOS artifacts (safety net)
        if: always() && steps.submit.outputs.sid != ''
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundle-signed
          path: |
            client/src-tauri/target/release/bundle/dmg/*.dmg
            client/src-tauri/target/release/bundle/macos/*.app.tar.gz
            submission_id.txt
          retention-days: 14
          if-no-files-found: error

      - name: Poll Apple notary status (50 min cap)
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SID: ${{ steps.submit.outputs.sid }}
        run: |
          set -e
          STATUS="Pending"
          for i in $(seq 1 100); do
            sleep 30
            INFO=$(xcrun notarytool info "$SID" \
              --apple-id "$APPLE_ID" \
              --password "$APPLE_PASSWORD" \
              --team-id "$APPLE_TEAM_ID" \
              --output-format json 2>/dev/null || echo '{}')
            STATUS=$(echo "$INFO" | jq -r '.status // "Unknown"')
            printf '[poll %3d / %5ds] status=%s\n' "$i" "$((i*30))" "$STATUS"
            case "$STATUS" in
              Accepted)
                echo "::notice::✓ Apple accepted submission $SID"
                exit 0
                ;;
              Invalid|Rejected)
                echo "::error::Apple rejected submission $SID ($STATUS)"
                xcrun notarytool log "$SID" \
                  --apple-id "$APPLE_ID" \
                  --password "$APPLE_PASSWORD" \
                  --team-id "$APPLE_TEAM_ID" || true
                exit 1
                ;;
            esac
          done
          echo "::error::Notarization still '$STATUS' after 50 min — submission=$SID"
          echo "::error::To finalize without rebuild: run finalize-mac.yml with submission_id=$SID, source_run_id=${{ github.run_id }}"
          exit 1

      - name: Staple notarization ticket to .dmg + .app
        run: |
          set -e
          xcrun stapler staple "${{ steps.locate.outputs.dmg }}"
          xcrun stapler staple "${{ steps.locate.outputs.app }}"

      # NOTE: no `working-directory: client` here — the steps.locate.outputs.*
      # paths are repo-root-relative, so cwd must stay at repo root. Invoke
      # pnpm in the client/ package via `--dir client`.
      - name: Repackage .app.tar.gz with stapled .app + regenerate updater .sig
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -e
          APP="${{ steps.locate.outputs.app }}"
          APP_TARGZ="${{ steps.locate.outputs.app_targz }}"
          APP_DIR=$(dirname "$APP")
          APP_NAME=$(basename "$APP")
          TARGZ_NAME=$(basename "$APP_TARGZ")
          # Tauri's tar happened pre-notarization; replace it with one made
          # from the now-stapled .app so updater serves notarized version.
          ( cd "$APP_DIR" && rm -f "$TARGZ_NAME" && tar -czf "$TARGZ_NAME" "$APP_NAME" )
          rm -f "${APP_TARGZ}.sig"
          # pnpm --dir changes cwd, so pass absolute path to the file.
          pnpm --dir client tauri signer sign "$GITHUB_WORKSPACE/$APP_TARGZ"
          ls -la "$APP_TARGZ" "${APP_TARGZ}.sig"

      - name: Verify signature + notarization
        run: |
          set +e
          APP="${{ steps.locate.outputs.app }}"
          DMG="${{ steps.locate.outputs.dmg }}"
          echo "=== codesign -dvv (.app) ==="
          codesign -dvv "$APP" 2>&1 | head -20
          echo "=== spctl assess (.app) ==="
          spctl --assess --type execute --verbose=4 "$APP" 2>&1 | head -5
          echo "=== stapler validate (.app) ==="
          xcrun stapler validate "$APP" 2>&1
          echo "=== stapler validate (.dmg) ==="
          xcrun stapler validate "$DMG" 2>&1

      - name: Show bundle output
        run: |
          ls -la client/src-tauri/target/release/bundle/dmg/ || true
          ls -la client/src-tauri/target/release/bundle/macos/ || true

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-bundle
          path: |
            client/src-tauri/target/release/bundle/dmg/*.dmg
            client/src-tauri/target/release/bundle/macos/*.app.tar.gz
            client/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 7
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────────
  # Publish runs as long as at least one platform built. Platforms whose
  # build was skipped have their entry carried over from the latest existing
  # release on the releases repo, so latest.json stays complete for users on
  # the un-rebuilt platform.
  publish:
    needs: [build-windows, build-macos]
    if: |
      !inputs.dry_run &&
      !cancelled() &&
      (needs.build-windows.result == 'success' || needs.build-macos.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (need tauri.conf.json for version)
        uses: actions/checkout@v4

      - name: Download Windows artifact
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-bundle
          path: dist/windows

      - name: Download macOS artifact
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: macos-bundle
          path: dist/macos

      - name: List downloaded files
        run: |
          echo "--- dist/windows ---"; ls -la dist/windows 2>/dev/null || echo "(no Windows artifacts — skipped)"
          echo "--- dist/macos ---"; ls -la dist/macos 2>/dev/null || echo "(no macOS artifacts — skipped)"

      - name: Publish to releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          NOTES: ${{ inputs.release_notes }}
          BUILT_WIN: ${{ needs.build-windows.result == 'success' }}
          BUILT_MAC: ${{ needs.build-macos.result == 'success' }}
        run: |
          set -e
          VERSION=$(jq -r .version client/src-tauri/tauri.conf.json)
          TAG="v$VERSION"
          REPO=rjxznb/whatsub-releases
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          # GitHub asset URLs replace spaces with dots.
          urlify() { basename "$1" | sed 's/ /./g'; }

          # ── Locate fresh artifacts (only those whose build ran) ─────
          MSI=""; MSI_SIG=""; DMG=""; APP_TARGZ=""; APP_SIG=""
          if [ "$BUILT_WIN" = "true" ]; then
            MSI=$(find dist/windows -name "*.msi" -type f | head -1)
            MSI_SIG=$(find dist/windows -name "*.msi.sig" -type f | head -1)
            [ -f "$MSI" ] && [ -f "$MSI_SIG" ] || { echo "::error::Windows artifact incomplete"; exit 1; }
          fi
          if [ "$BUILT_MAC" = "true" ]; then
            DMG=$(find dist/macos -name "*.dmg" -type f | head -1)
            APP_TARGZ=$(find dist/macos -name "*.app.tar.gz" -type f | head -1)
            APP_SIG=$(find dist/macos -name "*.app.tar.gz.sig" -type f | head -1)
            [ -f "$DMG" ] && [ -f "$APP_TARGZ" ] && [ -f "$APP_SIG" ] || { echo "::error::macOS artifact incomplete"; exit 1; }
          fi
          echo "BUILT_WIN=$BUILT_WIN MSI=$MSI"
          echo "BUILT_MAC=$BUILT_MAC DMG=$DMG APP_TARGZ=$APP_TARGZ"

          # ── For platforms NOT built this run, fetch the carry-over entry
          #    from the most recent existing release's latest.json ──────
          PREV_LATEST=""
          PREV_TAG=$(gh release list --repo "$REPO" --limit 5 \
                       --json tagName,isDraft,isPrerelease \
                       --jq 'map(select(.isDraft==false and .isPrerelease==false)) | .[0].tagName // ""')
          if [ -n "$PREV_TAG" ]; then
            PREV_LATEST=$(gh release download "$PREV_TAG" --repo "$REPO" \
                          --pattern "latest.json" -O - 2>/dev/null || echo "")
            echo "Carry-over base: $PREV_TAG"
          else
            echo "No previous release found — fresh manifest."
          fi

          # ── Create or reuse this release tag ───────────────────────
          if ! gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$REPO" \
              --title "whatsub $TAG" \
              --notes "$NOTES"
          fi

          # ── Upload only the freshly-built assets (--clobber to overwrite
          #    same-name assets if re-running this platform) ───────────
          UPLOAD_LIST=()
          [ -n "$MSI" ]       && UPLOAD_LIST+=("$MSI" "$MSI_SIG")
          [ -n "$APP_TARGZ" ] && UPLOAD_LIST+=("$DMG" "$APP_TARGZ" "$APP_SIG")
          if [ ${#UPLOAD_LIST[@]} -gt 0 ]; then
            gh release upload "$TAG" "${UPLOAD_LIST[@]}" --repo "$REPO" --clobber
          fi

          # ── Build platform entries for latest.json ──────────────────
          # If we built it: use this run's signature + URL anchored to $TAG.
          # If we didn't build it but the existing release ALSO has it, use
          # that entry (carry over from $TAG). Otherwise, fall back to PREV.
          win_entry=""
          if [ -n "$MSI" ]; then
            url="https://github.com/$REPO/releases/download/$TAG/$(urlify "$MSI")"
            sig=$(cat "$MSI_SIG")
            win_entry=$(jq -nc --arg s "$sig" --arg u "$url" '{signature:$s, url:$u}')
          else
            # Try the current $TAG release first (e.g. previously published Win at this tag);
            # fall back to the previous release.
            cur=$(gh release download "$TAG" --repo "$REPO" --pattern "latest.json" -O - 2>/dev/null || echo "")
            for src in "$cur" "$PREV_LATEST"; do
              if [ -n "$src" ]; then
                e=$(echo "$src" | jq -c '.platforms["windows-x86_64"] // empty')
                if [ -n "$e" ]; then win_entry="$e"; break; fi
              fi
            done
          fi

          mac_entry=""
          if [ -n "$APP_TARGZ" ]; then
            url="https://github.com/$REPO/releases/download/$TAG/$(urlify "$APP_TARGZ")"
            sig=$(cat "$APP_SIG")
            mac_entry=$(jq -nc --arg s "$sig" --arg u "$url" '{signature:$s, url:$u}')
          else
            cur=$(gh release download "$TAG" --repo "$REPO" --pattern "latest.json" -O - 2>/dev/null || echo "")
            for src in "$cur" "$PREV_LATEST"; do
              if [ -n "$src" ]; then
                e=$(echo "$src" | jq -c '.platforms["darwin-aarch64"] // empty')
                if [ -n "$e" ]; then mac_entry="$e"; break; fi
              fi
            done
          fi

          # ── Assemble manifest. Both entries optional; at least one will
          #    exist because we required at least one build to succeed. ──
          MANIFEST=$(jq -n \
            --arg version "$VERSION" \
            --arg notes "$NOTES" \
            --arg now "$NOW" \
            '{version:$version, notes:$notes, pub_date:$now, platforms:{}}')
          if [ -n "$win_entry" ]; then
            MANIFEST=$(echo "$MANIFEST" | jq --argjson e "$win_entry" '.platforms["windows-x86_64"] = $e')
          fi
          if [ -n "$mac_entry" ]; then
            MANIFEST=$(echo "$MANIFEST" | jq --argjson e "$mac_entry" '.platforms["darwin-aarch64"] = $e')
          fi
          echo "$MANIFEST" > latest.json

          echo "=== latest.json ==="
          cat latest.json

          gh release upload "$TAG" latest.json --repo "$REPO" --clobber

          # Notice line — shows which platforms went out in this run
          PLATS=""
          [ -n "$win_entry" ] && PLATS="$PLATS windows-x86_64"
          [ -n "$mac_entry" ] && PLATS="$PLATS darwin-aarch64"
          echo "::notice::Published $TAG (manifest covers:$PLATS)"

      # ───────────────────────────────────────────────────────────────
      # Mirror to JiHu GitLab (jihulab.com) so users in mainland China can
      # update without proxying — GitHub release-assets.githubusercontent.com
      # (Azure Blob CDN) is intermittently unreachable from China without a
      # working VPN, and Tauri's plugin-updater reqwest doesn't read OS proxy
      # settings (only HTTPS_PROXY env var).
      #
      # Strategy: dual-publish. Updater endpoints array prefers jihulab; if
      # that ever goes down, GitHub mirror is fallback. Same minisign key,
      # same artifacts — only the URLs in latest.json differ.
      #
      # Project: rjxznb-group/whatsub-release (id 335658, public).
      # Auth: GITLAB_TOKEN secret (api scope).
      # Asset hosting: GitLab Generic Packages → release assets via
      #                direct_asset_path so the public URL pattern is
      #                <host>/<path>/-/releases/<tag>/downloads/<file>.
      - name: Mirror to JiHu GitLab
        if: env.GITLAB_TOKEN != ''
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          NOTES: ${{ inputs.release_notes }}
          BUILT_WIN: ${{ needs.build-windows.result == 'success' }}
          BUILT_MAC: ${{ needs.build-macos.result == 'success' }}
        run: |
          set -e
          VERSION=$(jq -r .version client/src-tauri/tauri.conf.json)
          TAG="v$VERSION"
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          GITLAB_HOST="https://jihulab.com"
          PROJECT_ID="335658"
          PROJECT_PATH="rjxznb-group/whatsub-release"
          API="$GITLAB_HOST/api/v4/projects/$PROJECT_ID"

          urlify() { basename "$1" | sed 's/ /./g'; }

          # PUT to Generic Packages: idempotent (same version+filename
          # overwrites). Uses --upload-file which streams without reading
          # whole file into memory — fine for 100+ MB artifacts.
          upload_file() {
            local file="$1"
            local name
            name=$(urlify "$file")
            echo "  → uploading $name ($(du -h "$file" | cut -f1))"
            curl -sf --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
                 --upload-file "$file" \
                 "$API/packages/generic/whatsub/$VERSION/$name" > /dev/null
          }

          # ── Locate fresh artifacts (re-using same dist/ from earlier step) ──
          MSI=""; MSI_SIG=""; DMG=""; APP_TARGZ=""; APP_SIG=""
          if [ "$BUILT_WIN" = "true" ]; then
            MSI=$(find dist/windows -name "*.msi" -type f | head -1)
            MSI_SIG=$(find dist/windows -name "*.msi.sig" -type f | head -1)
          fi
          if [ "$BUILT_MAC" = "true" ]; then
            DMG=$(find dist/macos -name "*.dmg" -type f | head -1)
            APP_TARGZ=$(find dist/macos -name "*.app.tar.gz" -type f | head -1)
            APP_SIG=$(find dist/macos -name "*.app.tar.gz.sig" -type f | head -1)
          fi

          # ── Carry-over: if a platform wasn't built, pull its entry from
          #    jihulab's previous release manifest so latest.json stays
          #    complete for users on the un-rebuilt platform. ─────────────
          PREV_LATEST=""
          PREV_TAG=$(curl -s --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
                          "$API/releases?per_page=1" \
                     | jq -r '.[0].tag_name // ""')
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ]; then
            PREV_LATEST=$(curl -sL "$GITLAB_HOST/$PROJECT_PATH/-/releases/$PREV_TAG/downloads/latest.json" 2>/dev/null || echo "")
          fi

          # ── Build manifest with jihulab download URLs ──────────────────
          # URL pattern: $GITLAB_HOST/$PROJECT_PATH/-/releases/$TAG/downloads/$filename
          # GitLab routes that path to the asset link whose direct_asset_path matches.
          jihulab_url() {
            echo "$GITLAB_HOST/$PROJECT_PATH/-/releases/$TAG/downloads/$(urlify "$1")"
          }

          win_entry=""
          if [ -n "$MSI" ]; then
            url=$(jihulab_url "$MSI")
            sig=$(cat "$MSI_SIG")
            win_entry=$(jq -nc --arg s "$sig" --arg u "$url" '{signature:$s, url:$u}')
          elif [ -n "$PREV_LATEST" ]; then
            win_entry=$(echo "$PREV_LATEST" | jq -c '.platforms["windows-x86_64"] // empty')
          fi

          mac_entry=""
          if [ -n "$APP_TARGZ" ]; then
            url=$(jihulab_url "$APP_TARGZ")
            sig=$(cat "$APP_SIG")
            mac_entry=$(jq -nc --arg s "$sig" --arg u "$url" '{signature:$s, url:$u}')
          elif [ -n "$PREV_LATEST" ]; then
            mac_entry=$(echo "$PREV_LATEST" | jq -c '.platforms["darwin-aarch64"] // empty')
          fi

          MANIFEST=$(jq -n \
            --arg v "$VERSION" --arg n "$NOTES" --arg d "$NOW" \
            '{version:$v, notes:$n, pub_date:$d, platforms:{}}')
          [ -n "$win_entry" ] && MANIFEST=$(echo "$MANIFEST" | jq --argjson e "$win_entry" '.platforms["windows-x86_64"] = $e')
          [ -n "$mac_entry" ] && MANIFEST=$(echo "$MANIFEST" | jq --argjson e "$mac_entry" '.platforms["darwin-aarch64"] = $e')
          # Use a different filename than the GitHub publish step's latest.json
          # so they don't collide on disk (we may upload both in one step later).
          echo "$MANIFEST" > latest-jihulab.json

          echo "=== latest.json (jihulab) ==="
          cat latest-jihulab.json

          # ── Upload artifacts ─────────────────────────────────────────
          # Rename in-place to "latest.json" right before upload — the asset
          # link on the release uses that exact name as direct_asset_path.
          cp latest-jihulab.json latest.json
          upload_file latest.json
          [ -n "$MSI" ]       && { upload_file "$MSI"; upload_file "$MSI_SIG"; }
          [ -n "$APP_TARGZ" ] && { upload_file "$DMG"; upload_file "$APP_TARGZ"; upload_file "$APP_SIG"; }

          # ── Build asset links array for the Release record ──────────
          # Each link: name (filename), url (package URL — what GitLab serves
          # the bytes from), direct_asset_path (the routing key under
          # /-/releases/<tag>/downloads/), link_type=package.
          LINKS="[]"
          add_link() {
            local file="$1"
            local name
            name=$(urlify "$file")
            local pkg_url="$API/packages/generic/whatsub/$VERSION/$name"
            LINKS=$(echo "$LINKS" | jq --arg n "$name" --arg u "$pkg_url" --arg p "/$name" \
                    '. + [{name:$n, url:$u, direct_asset_path:$p, link_type:"package"}]')
          }
          add_link latest.json
          [ -n "$MSI" ]       && { add_link "$MSI"; add_link "$MSI_SIG"; }
          [ -n "$APP_TARGZ" ] && { add_link "$DMG"; add_link "$APP_TARGZ"; add_link "$APP_SIG"; }

          # ── Create / refresh the release ────────────────────────────
          # GitLab has no "PATCH assets" so we delete + recreate. Tag is
          # preserved (DELETE only removes the release record). On second
          # POST GitLab sees existing tag and ties new release to it
          # (ref param ignored when tag exists).
          if curl -sf --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "$API/releases/$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists — deleting + recreating to refresh asset links"
            curl -sf -X DELETE --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "$API/releases/$TAG" > /dev/null
          fi

          PAYLOAD=$(jq -n \
            --arg name "whatsub $TAG" \
            --arg tag "$TAG" \
            --arg desc "$NOTES" \
            --arg ref "main" \
            --argjson links "$LINKS" \
            '{name:$name, tag_name:$tag, description:$desc, ref:$ref, assets:{links:$links}}')

          curl -sf -X POST --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
               --header "Content-Type: application/json" \
               --data "$PAYLOAD" \
               "$API/releases" > /dev/null

          echo "::notice::JiHu published $TAG → $GITLAB_HOST/$PROJECT_PATH/-/releases/$TAG"
