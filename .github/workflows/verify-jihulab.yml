# Temporary one-off — set project to public via API. Delete after.
name: Verify JiHu GitLab Setup

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Force visibility=public via API
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set +e
          API="https://jihulab.com/api/v4/projects/335658"
          echo "=== PUT visibility=public ==="
          RES=$(curl -s -X PUT \
            --header "PRIVATE-TOKEN: $GITLAB_TOKEN" \
            --write-out "\nHTTP_CODE=%{http_code}\n" \
            "$API?visibility=public")
          echo "$RES"
          echo
          echo "=== Re-read visibility ==="
          curl -s --header "PRIVATE-TOKEN: $GITLAB_TOKEN" "$API" \
            | jq -r '"visibility=" + .visibility, "default_branch=" + .default_branch'
