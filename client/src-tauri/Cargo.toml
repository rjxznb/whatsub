[package]
name = "client"
version = "0.1.112"
description = "A Tauri App"
authors = ["jimmy"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Override the binary name. Cargo defaults to package.name (= "client"),
# producing `client.exe` / `client` 鈥?the user-visible exe name in install
# dirs and process lists. We want `whatsub.exe` / `whatsub` instead so it
# matches the product. Package.name itself stays "client" since renaming
# it would break Cargo.lock + every workspace reference downstream.
[[bin]]
name = "whatsub"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
# Stable per-machine UUID for license device fingerprinting:
#   - Windows: HKLM\SOFTWARE\Microsoft\Cryptography\MachineGuid
#   - macOS:   IOPlatformUUID
#   - Linux:   /etc/machine-id
# Same machine boots 鈫?same uid; different machine 鈫?different uid.
machine-uid = "0.5"
# Pretty device label for the admin UI ("renjx 鐨?MacBook" instead of a hash)
# and OS hostname fallback. Small crate, no transitive heavies.
whoami = "1.5"
# Cookie struct + parser for the in-app YouTube login flow. Tauri's
# WebviewWindow::cookies() returns Vec<cookie::Cookie<'static>>; we
# also use this directly in the Netscape serializer + tests.
cookie = "0.18"
# URL parsing for navigation listeners + cookie-domain matching.
url = "2"
# WebSocket client for two consumers:
#   1. Chrome DevTools Protocol over ws://localhost:<port> (system-browser login)
#   2. Edge neural TTS over wss://speech.platform.bing.com (commands/edge_tts.rs)
# (2) needs TLS, so we enable the native-tls feature 鈥?it reuses the native-tls
# crate reqwest already pulls in (schannel on Windows / Secure Transport on
# macOS), so it adds no new system TLS stack.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "native-tls"] }
# CancellationToken for the per-import cancel signal. Threaded through
# run_sidecar so that 鉁?in the UI translates to killing yt-dlp / ffmpeg /
# whisper child processes mid-flight instead of letting them finish
# silently in the background.
tokio-util = "0.7"
base64 = "0.22.1"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
